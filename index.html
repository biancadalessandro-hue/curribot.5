<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CurriBot 5</title><style>
:root{--ink:#21363a;--muted:#647879;--bg:#f8f6f0;--paper:#fffefa;--line:#dee7e2;--teal:#287b77;--teal2:#e5f5f0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,'Arial Rounded MT Bold',system-ui,-apple-system,sans-serif}
.hidden{display:none!important}.shell{min-height:100dvh;display:flex;flex-direction:column}
.bar{height:60px;flex-shrink:0;display:flex;align-items:center;gap:12px;background:var(--paper);border-bottom:1px solid var(--line);padding:6px 18px}
.logo{font-weight:950;font-size:23px}.logo span{color:var(--teal)}.bar .hint{margin-left:auto;color:var(--muted);font-size:12px}
.btn{cursor:pointer;font:inherit;background:var(--teal2);color:var(--teal);border:1px solid #bdded3;border-radius:12px;padding:10px 13px;font-weight:900}
.stage{display:flex;align-items:center;justify-content:center;flex:1}.content{width:100%;max-width:960px;padding:18px;text-align:center}
.content h1{font-size:clamp(29px,4vw,48px);line-height:1.12;margin:6px 0 12px}.lead{font-size:17px;color:var(--muted)}
.robot svg{max-width:175px;height:175px;filter:drop-shadow(0 10px 8px #3c7e682a)}.eyebrow{color:var(--teal);font-weight:900;font-size:12px;letter-spacing:1px}
.choices{display:flex;justify-content:center;flex-wrap:wrap;gap:13px;margin:20px 0}.choice{cursor:pointer;border:2px solid var(--teal);background:var(--teal);color:white;font-size:18px;font-weight:900;border-radius:18px;min-width:210px;padding:18px}
.choice:last-child{background:var(--paper);color:var(--ink);border-color:var(--line)}.areas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}
.area{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:16px;min-height:160px;font-weight:900}.area:hover,.area:focus-visible{border-color:var(--teal);background:var(--teal2)}.area .emoji{font-size:42px}
@media(max-width:750px){.areas{grid-template-columns:repeat(2,1fr)}.area{min-height:110px;padding:9px}.area .emoji{font-size:32px}.bar .hint{display:none}.robot svg{height:130px}}

/* Audio de bienvenida cerca del personaje, destacado para niños de sala de 5 */
.welcome-play{display:inline-flex;align-items:center;justify-content:center;min-height:62px;margin:5px auto 14px;padding:13px 22px;border:3px solid #24716e;border-radius:20px;background:#287b77;color:#fff;font:inherit;font-weight:950;font-size:clamp(15px,2vw,20px);cursor:pointer;box-shadow:0 6px 0 #d8eae2}
.welcome-play:focus-visible{outline:4px solid #ffd283;outline-offset:4px}
.welcome-play:active{transform:translateY(2px);box-shadow:0 3px 0 #d8eae2}
@media(max-height:670px){.content{padding:8px}.robot svg{height:115px}.content h1{font-size:28px;margin:3px 0}.welcome-play{min-height:48px;margin:2px 0 6px;padding:7px 16px}.choices{margin:10px 0}.choice{padding:12px}}
</style></head><body><div class="shell"><header class="bar"><div class="logo">✳ CurriBot <span>5</span></div><span class="hint">PROGRAMAMOS · PROBAMOS · REVISAMOS</span></header><main class="stage">

let mode=null;const p=new URLSearchParams(location.search);
function silence(){for(const a of [HOME,SELECT]){a.pause();a.currentTime=0}document.getElementById('homeAudio').textContent='🔊 ESCUCHAR A CURRIBOT';document.getElementById('selectionAudio').textContent='🔊 ESCUCHAR'}
function speak(a,id,label){const playing=!a.paused;silence();if(playing)return;a.play().then(()=>document.getElementById(id).textContent='■ DETENER').catch(silence);a.onended=silence}
document.getElementById('homeAudio').onclick=()=>speak(HOME,'homeAudio','ESCUCHAR A CURRIBOT');document.getElementById('selectionAudio').onclick=()=>speak(SELECT,'selectionAudio','ESCUCHAR');
function setMode(m){mode=m;silence();document.getElementById('welcome').classList.add('hidden');document.getElementById('select').classList.remove('hidden');document.querySelectorAll('[data-area]').forEach(e=>e.href=e.dataset.area+'.html?modo='+encodeURIComponent(m));}
document.getElementById('kid').onclick=()=>setMode('ninos');document.getElementById('teacher').onclick=()=>setMode('docentes');
document.getElementById('goBack').onclick=()=>{mode=null;silence();document.getElementById('select').classList.add('hidden');document.getElementById('welcome').classList.remove('hidden')};
if(p.get('vista')==='areas'&&['ninos','docentes'].includes(p.get('modo')))setMode(p.get('modo'));
</script></body></html>
